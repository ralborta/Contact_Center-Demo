name: CI

on:
  push:
    branches: [citas-hospital, master]
  pull_request:
    branches: [citas-hospital, master]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: citas
          POSTGRES_DB: citas_hospital
          # Servicio efímero de CI: sin password hardcodeado (GitGuardian)
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citas -d citas_hospital"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://citas@localhost:5432/citas_hospital?schema=public
      TZ: America/La_Paz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Derive ephemeral CI secrets
        run: |
          echo "JWT_SECRET=ci-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "AGENT_API_SECRET=ci-agent-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "SEED_ADMIN_PASSWORD=ci-admin-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx prisma migrate deploy --schema=prisma/schema.prisma
      - run: npx prisma generate --schema=prisma/schema.prisma
      - run: npm run seed --workspace=apps/cc-backend
      - run: npm run build --workspace=apps/cc-backend
      - run: npm test --workspace=apps/cc-backend

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=apps/cc-frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
