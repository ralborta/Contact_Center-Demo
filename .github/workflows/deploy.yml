# Deploy: configurar auto-deploy en Easypanel desde la rama citas-hospital.
# No se dispara Railway ni Vercel desde esta rama.
name: Easypanel note

on:
  push:
    branches: [citas-hospital]

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Reminder
        run: |
          echo "Deploy en Easypanel (proyecto citas-hospital)."
          echo "Servicios: web (Dockerfile.web) + api (Dockerfile.api) + Postgres."
          echo "Branch: citas-hospital. Ver README_DEPLOY.md"
